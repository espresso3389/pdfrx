name: pdfrx_example
description: 'Demonstrates how to use the pdfrx plugin.'
publish_to: 'none'

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  pdfrx:
    path: ../../

  cupertino_icons: ^2.0.0
  rxdart: ^0.28.0
  url_launcher: ^6.3.3
  synchronized: ^3.6.1
  file_selector: ^1.1.0
  http: ^1.6.0

  material_ui: ^1.11.1
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints:

flutter:
  uses-material-design: true

  assets:
    - assets/
