name: pdf_combine
description: 'PDF Combine - Combine multiple PDF files into one with page selection'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0

  pdfrx:
    path: ../../

  file_selector: ^1.1.0
  share_plus: ^13.3.1
  path_provider: ^2.1.5
  animated_reorderable_list: ^1.3.0
  web: ^1.1.1
  desktop_drop: ^0.8.4
  jpeg_encode: ^1.0.1

  material_ui: ^1.11.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:

flutter:
  uses-material-design: true
