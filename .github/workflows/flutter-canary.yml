name: Flutter Stable Canary

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: flutter-stable-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stable:
    name: Moving stable compatibility (Linux and Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native test dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Setup moving Flutter stable
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch stable ~/flutter
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          ~/flutter/bin/flutter config --no-enable-android
          ~/flutter/bin/flutter --version --machine > flutter-version.json
          node --version > node-version.txt

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Analyze engine and viewer
        run: |
          dart analyze --fatal-infos packages/pdfrx_engine
          flutter analyze --fatal-infos packages/pdfrx

      - name: Test PDFium bindings
        working-directory: packages/pdfium_dart
        run: dart test

      - name: Test engine regressions
        working-directory: packages/pdfrx_engine
        run: dart test

      - name: Test native viewer regressions
        working-directory: packages/pdfrx
        run: flutter test --concurrency=1

      - name: Test process-wide PDFium gate
        working-directory: packages/pdfrx_engine
        run: dart test test/process_gate_smoke.dart

      - name: Test worker regressions
        run: node .github/scripts/web-tests.mjs worker

      - name: Test browser bridge regressions
        run: node .github/scripts/web-tests.mjs browser

      - name: Record exact canary SDK versions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flutter-stable-canary-versions
          path: |
            flutter-version.json
            node-version.txt
