name: Native HTTP Cache

on:
  pull_request:
    branches: [master, main]
    paths:
      - 'packages/pdfrx_engine/**'
      - 'packages/pdfium_dart/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/native-http-cache-test.yml'
  push:
    branches: [master, main]
    paths:
      - 'packages/pdfrx_engine/**'
      - 'packages/pdfium_dart/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/native-http-cache-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-http-cache-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.1'
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DASH__SUPPRESS_ANALYTICS: 'true'

jobs:
  test:
    name: HTTP ranges and disk ownership (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux native compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang

      - name: Setup fixed Flutter baseline (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch "$FLUTTER_VERSION" "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-enable-android --no-enable-linux-desktop
          "$RUNNER_TEMP/flutter/bin/flutter" --version --machine > flutter-version.json

      - name: Setup fixed Flutter baseline (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdkPath = Join-Path $env:RUNNER_TEMP 'flutter'
          git clone https://github.com/flutter/flutter.git --depth 1 --branch $env:FLUTTER_VERSION $sdkPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$sdkPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$sdkPath\bin\flutter.bat" config --no-enable-android --no-enable-linux-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$sdkPath\bin\flutter.bat" --version --machine > flutter-version.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Test HTTP semantics, coalescing, cache quota and process leases
        timeout-minutes: 10
        working-directory: packages/pdfrx_engine
        run: >-
          dart test --reporter expanded --file-reporter json:http-cache-results.json
          test/http_cache_control_test.dart
          test/pdf_file_cache_auth_identity_test.dart
          test/pdf_file_cache_coalescing_test.dart
          test/pdf_file_cache_policy_test.dart
          test/pdf_file_cache_policy_native_test.dart
          test/pdf_file_cache_quota_test.dart
          test/pdf_file_cache_range_test.dart
          test/pdf_file_cache_timeout_test.dart
          test/pdf_file_cache_timeout_native_test.dart

      - name: Preserve exact SDK and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-http-cache-${{ matrix.os }}-${{ github.sha }}
          path: |
            flutter-version.json
            packages/pdfrx_engine/http-cache-results.json
