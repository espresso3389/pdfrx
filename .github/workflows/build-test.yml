name: Build Test

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - 'doc/**'

  pull_request:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - 'doc/**'
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android'
        required: false
        type: boolean
        default: true
      build_ios:
        description: 'Build iOS'
        required: false
        type: boolean
        default: true
      build_macos:
        description: 'Build macOS'
        required: false
        type: boolean
        default: true
      build_linux:
        description: 'Build Linux'
        required: false
        type: boolean
        default: true
      build_linux_arm64:
        description: 'Build Linux ARM64'
        required: false
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows'
        required: false
        type: boolean
        default: true
      build_windows_arm64:
        description: 'Build Windows ARM64'
        required: false
        type: boolean
        default: true
      build_web:
        description: 'Build Web'
        required: false
        type: boolean
        default: true

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  # Android build
  android:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_android }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch "$FLUTTER_VERSION" ~/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          ~/flutter/bin/flutter config --no-enable-linux-desktop
          ~/flutter/bin/flutter doctor -v
          yes | ~/flutter/bin/flutter doctor --android-licenses

      - name: Install dependencies
        working-directory: packages/pdfrx/example/viewer
        run: flutter pub get

      - name: Build App Bundle
        working-directory: packages/pdfrx/example/viewer
        run: flutter build apk --debug --verbose

  # iOS build
  ios:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_ios }}
    runs-on: macos-latest
    strategy:
      matrix:
        package_manager: [cocoapods, swiftpm]
    name: ios-${{ matrix.package_manager }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch "$FLUTTER_VERSION" ~/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          ~/flutter/bin/flutter config --no-enable-android --no-enable-macos-desktop
          ~/flutter/bin/flutter doctor -v

      - name: Configure package manager
        run: |
          if [ "${{ matrix.package_manager }}" = "swiftpm" ]; then
            ~/flutter/bin/flutter config --enable-swift-package-manager
          else
            ~/flutter/bin/flutter config --no-enable-swift-package-manager
          fi

      - name: Install dependencies
        working-directory: packages/pdfrx/example/viewer
        run: flutter pub get

      - name: Build iOS (no signing) - ${{ matrix.package_manager }}
        working-directory: packages/pdfrx/example/viewer
        run: flutter build ios --debug --no-codesign --verbose

  # macOS build
  macos:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_macos }}
    runs-on: macos-latest
    strategy:
      matrix:
        package_manager: [cocoapods, swiftpm]
    name: macos-${{ matrix.package_manager }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch "$FLUTTER_VERSION" ~/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          ~/flutter/bin/flutter config --no-enable-android --no-enable-ios
          ~/flutter/bin/flutter doctor -v

      - name: Configure package manager
        run: |
          if [ "${{ matrix.package_manager }}" = "swiftpm" ]; then
            ~/flutter/bin/flutter config --enable-swift-package-manager
          else
            ~/flutter/bin/flutter config --no-enable-swift-package-manager
          fi

      - name: Install dependencies
        working-directory: packages/pdfrx/example/viewer
        run: flutter pub get

      - name: Build macOS - ${{ matrix.package_manager }}
        working-directory: packages/pdfrx/example/viewer
        run: flutter build macos --debug --verbose

      - name: Prepare PDFium native asset for macOS Flutter tests - ${{ matrix.package_manager }}
        working-directory: packages/pdfium_dart
        run: dart test test/pdfium_test.dart test/native_assets_manifest_test.dart

      - name: Test complete engine regressions on macOS
        if: matrix.package_manager == 'swiftpm'
        timeout-minutes: 10
        working-directory: packages/pdfrx_engine
        run: dart test

      - name: Test pdfrx on macOS - ${{ matrix.package_manager }}
        working-directory: packages/pdfrx
        run: >-
          flutter test
          test/pdfium_loading_test.dart
          test/pdf_viewer_visible_render_state_test.dart
          test/pdf_viewer_selection_drag_test.dart
          test/pdf_viewer_selection_memory_test.dart

      - name: Test process-wide PDFium gate and text cache
        timeout-minutes: 5
        working-directory: packages/pdfrx_engine
        run: dart test test/process_gate_smoke.dart test/pdf_page_text_cache_test.dart

      - name: Test native worker scheduling
        if: matrix.package_manager == 'swiftpm'
        timeout-minutes: 5
        working-directory: packages/pdfrx_engine
        run: >-
          dart test
          test/background_worker_test.dart
          test/background_worker_task_test.dart
          test/background_worker_cancellation_queue_test.dart

  # Linux build
  linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Setup Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch "$FLUTTER_VERSION" ~/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          ~/flutter/bin/flutter config --no-enable-android
          ~/flutter/bin/flutter doctor -v

      - name: Install dependencies
        working-directory: packages/pdfrx/example/viewer
        run: flutter pub get

      - name: Test all PDFium bindings, native assets, and download regressions
        timeout-minutes: 10
        working-directory: packages/pdfium_dart
        run: dart test

      - name: Test all engine regressions
        timeout-minutes: 10
        working-directory: packages/pdfrx_engine
        run: dart test

      - name: Build Linux
        working-directory: packages/pdfrx/example/viewer
        run: flutter build linux --debug --verbose

      - name: Test all native viewer regressions
        timeout-minutes: 15
        working-directory: packages/pdfrx
        run: flutter test --concurrency=1

      - name: Test process-wide PDFium gate
        timeout-minutes: 5
        working-directory: packages/pdfrx_engine
        run: dart test test/process_gate_smoke.dart

      - name: Test native worker scheduling
        timeout-minutes: 5
        working-directory: packages/pdfrx_engine
        run: >-
          dart test
          test/background_worker_test.dart
          test/background_worker_task_test.dart
          test/background_worker_cancellation_queue_test.dart

  # Linux ARM64 build
  linux-arm64:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_linux_arm64 }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Setup Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch "$FLUTTER_VERSION" ~/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          ~/flutter/bin/flutter config --no-enable-android
          ~/flutter/bin/flutter doctor -v

      - name: Install dependencies
        working-directory: packages/pdfrx/example/viewer
        run: flutter pub get

      - name: Build Linux
        working-directory: packages/pdfrx/example/viewer
        run: flutter build linux --debug --verbose

  # Windows build
  windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        shell: pwsh
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch "$env:FLUTTER_VERSION" C:\flutter
          echo "C:\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          C:\flutter\bin\flutter.bat config --no-enable-android
          C:\flutter\bin\flutter.bat doctor -v

      - name: Install dependencies
        working-directory: packages/pdfrx/example/viewer
        run: C:\flutter\bin\flutter.bat pub get

      - name: Build Windows
        working-directory: packages/pdfrx/example/viewer
        run: C:\flutter\bin\flutter.bat build windows --debug --verbose

      - name: Test complete engine regressions on Windows
        timeout-minutes: 10
        working-directory: packages/pdfrx_engine
        run: dart test

      - name: Test PDFium bindings and Windows system-proxy integration
        timeout-minutes: 10
        working-directory: packages/pdfium_dart
        run: dart test

      - name: Test process-wide PDFium gate
        timeout-minutes: 5
        working-directory: packages/pdfrx_engine
        run: C:\flutter\bin\dart.bat test test/process_gate_smoke.dart

      - name: Test native worker scheduling
        timeout-minutes: 5
        working-directory: packages/pdfrx_engine
        run: >-
          C:\flutter\bin\dart.bat test
          test/background_worker_test.dart
          test/background_worker_task_test.dart
          test/background_worker_cancellation_queue_test.dart

  # Windows ARM64 build (requires ARM64 runner or cross-compilation)
  windows-arm64:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_windows_arm64 }}
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        shell: pwsh
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch "$env:FLUTTER_VERSION" C:\flutter
          echo "C:\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          C:\flutter\bin\flutter.bat config --no-enable-android
          C:\flutter\bin\flutter.bat doctor -v

      - name: Install dependencies
        working-directory: packages/pdfrx/example/viewer
        run: C:\flutter\bin\flutter.bat pub get

      - name: Build Windows ARM64
        working-directory: packages/pdfrx/example/viewer
        run: C:\flutter\bin\flutter.bat build windows --debug --verbose

  # Web build
  web:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_web }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch "$FLUTTER_VERSION" ~/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          ~/flutter/bin/flutter config --no-enable-android --no-enable-linux-desktop
          ~/flutter/bin/flutter doctor -v

      - name: Install dependencies
        working-directory: packages/pdfrx/example/viewer
        run: flutter pub get

      - name: Verify automatic Web test discovery
        run: node --test .github/scripts/web-tests.test.mjs

      - name: Test all worker and communicator regressions
        timeout-minutes: 5
        run: node .github/scripts/web-tests.mjs worker

      - name: Test all Dart-JavaScript-WASM browser regressions
        timeout-minutes: 15
        run: node .github/scripts/web-tests.mjs browser

      - name: Build Web
        working-directory: packages/pdfrx/example/viewer
        run: flutter build web --verbose

      - name: Build Web (WASM)
        working-directory: packages/pdfrx/example/viewer
        run: flutter build web --wasm --verbose
