name: Performance Samples

on:
  workflow_dispatch:
    inputs:
      samples:
        description: 'Fresh process samples per AOT benchmark (3-20)'
        type: number
        default: 5

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  aot:
    name: Linux AOT measurements (no timing thresholds)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup fixed Flutter baseline
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch "$FLUTTER_VERSION" ~/flutter
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          ~/flutter/bin/flutter config --no-enable-android --no-enable-linux-desktop
          ~/flutter/bin/flutter --version --machine > flutter-version.json

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Compile and collect fresh process samples
        env:
          SAMPLES: ${{ inputs.samples }}
        run: dart .github/scripts/performance_samples.dart --samples "$SAMPLES"

      - name: Upload measurements and reproduction metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-${{ github.sha }}
          path: |
            .dart_tool/ci-performance/*.json
            .dart_tool/ci-performance/*.jsonl
            .dart_tool/ci-performance/*.log
            flutter-version.json
